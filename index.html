<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What's For Dinner</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />

    <link rel="stylesheet" href="./style/bootstrap.min.css" />
    <link rel="stylesheet" href="./style/style.css" />
  </head>

  <body>
    <header class="header-section bg-white shadow-sm border-bottom my-nav">
      <div class="container py-3">
        <div class="d-flex align-items-center justify-content-between">
          <div class="d-flex align-items-center gap-3">
            <div class="logo-icon">
              <i class="fa-solid fa-utensils text-white"></i>
            </div>

            <div>
              <h1 class="h5 h-md-4 fw-bold mb-0 text-dark">
                What's For Dinner
              </h1>
              <small class="text-muted"> Your daily meal inspiration </small>
            </div>
          </div>

          <div class="d-none d-md-flex align-items-center gap-4">
            <button class="nav-icon-btn">
              <i class="fa-solid fa-bookmark"></i>
            </button>

            <button class="nav-icon-btn">
              <i class="fa-solid fa-clock-rotate-left"></i>
            </button>

            <button class="nav-icon-btn">
              <i class="fa-solid fa-gear"></i>
            </button>

            <img
              src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-4.jpg"
              class="profile-img"
              alt="profile"
            />
          </div>

          <button
            class="btn d-md-none nav-icon-btn"
            data-bs-toggle="collapse"
            data-bs-target="#mobileMenu"
          >
            <i class="fa-solid fa-bars fs-4"></i>
          </button>
        </div>

        <div id="mobileMenu" class="collapse mt-3 pt-3 border-top">
          <div class="d-flex flex-column gap-3">
            <button class="mobile-item">
              <i class="fa-solid fa-bookmark me-3"></i> Saved Recipes
            </button>

            <button class="mobile-item">
              <i class="fa-solid fa-clock-rotate-left me-3"></i> Recent
            </button>

            <button class="mobile-item">
              <i class="fa-solid fa-gear me-3"></i> Settings
            </button>

            <button class="mobile-item">
              <img
                src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-4.jpg"
                class="mobile-avatar me-3"
              />
              Profile
            </button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="recipe py-5">
        <div class="container">
          <div class="row">
            <div
              class="col-sm-12 col-md-12 col-lg-7 col-xl-7 position-relative"
            >
              <div class="recipe-image" id="recipe-image"></div>
              <div class="rate">
                <div class="rate-content d-flex align-items-center gap-2">
                  <i class="fa-solid fa-star text-warning"></i>
                  <span id="ratingsAverage"></span>
                  <span class="reviews text-muted" id="ratingsQuantity"> </span>
                </div>
              </div>
              <div class="cook-time position-absolute">
                <div class="row text-center">
                  <div class="col">
                    <i class="fa-solid fa-clock text-warning fs-4"></i>
                    <p class="small text-muted mb-1">Prep</p>
                    <p id="prepTime" class="fw-bold mb-0"></p>
                  </div>
                  <div class="col">
                    <i class="fa-solid fa-fire-burner text-danger fs-4"></i>
                    <p class="small text-muted mb-1">Cook Time</p>
                    <p id="cookTime" class="fw-bold mb-0"></p>
                  </div>
                  <div class="col">
                    <i class="fa-solid fa-users text-primary fs-4"></i>
                    <p class="small text-muted mb-1">Servings</p>
                    <p id="servings" class="fw-bold mb-0"></p>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-sm-12 col-md-12 col-lg-5 col-xl-5 py-4">
              <div class="d-flex flex-wrap justify-content-between">
                <div class="">
                  <span id="difficulty-badge" class="badge bg-success"></span>
                  <span id="category-badge" class="badge bg-primary"></span>
                </div>
                <div
                  class="bookmark-icons d-flex justify-content-between gap-4"
                >
                  <button class="btn btn-light">
                    <i class="fa-solid fa-bookmark"></i>
                  </button>
                  <button class="btn btn-light">
                    <i class="fa-solid fa-share-nodes"></i>
                  </button>
                </div>
              </div>
              <div class="recipe-title m-3">
                <h2 id="name"></h2>
                <p id="description"></p>
              </div>
              <div class="tabs mx-auto">
                <ul
                  class="nav nav-tabs mb-4 d-flex flex-nowrap"
                  id="recipeTabs"
                  role="tablist"
                >
                  <li class="nav-item" role="presentation">
                    <button
                      class="nav-link active d-flex align-items-center justify-content-center gap-2"
                      id="pills-ingredients-tab"
                      data-bs-toggle="tab"
                      data-bs-target="#pills-ingredients"
                      type="button"
                    >
                      <i class="fa-solid fa-list-check"></i>
                      <span class="truncate">Ingredients</span>
                    </button>
                  </li>

                  <li class="nav-item" role="presentation">
                    <button
                      class="nav-link d-flex align-items-center justify-content-center gap-2"
                      id="pills-instructions-tab"
                      data-bs-toggle="tab"
                      data-bs-target="#pills-instructions"
                      type="button"
                    >
                      <i class="fa-solid fa-book-open"></i>
                      <span class="truncate">Instructions</span>
                    </button>
                  </li>

                  <li class="nav-item" role="presentation">
                    <button
                      class="nav-link d-flex align-items-center justify-content-center gap-2"
                      id="pills-nutrition-tab"
                      data-bs-toggle="tab"
                      data-bs-target="#pills-nutrition"
                      type="button"
                    >
                      <i class="fa-solid fa-chart-pie"></i>
                      <span class="truncate">Nutrition</span>
                    </button>
                  </li>

                  <li class="nav-item" role="presentation">
                    <button
                      class="nav-link d-flex align-items-center justify-content-center gap-2"
                      id="pills-chef'sTips-tab"
                      data-bs-toggle="tab"
                      data-bs-target="#pills-tips"
                      type="button"
                    >
                      <i class="fa-solid fa-lightbulb"></i>
                      <span class="truncate">Chef's Tips</span>
                    </button>
                  </li>
                </ul>
                <div class="tab-content" id="pills-tabContent">
                  <div
                    class="tab-pane fade show active"
                    id="pills-ingredients"
                    role="tabpanel"
                    aria-labelledby="pills-ingredients-tab"
                    tabindex="0"
                  >
                    <div
                      class="tab-content"
                      style="max-height: 350px; overflow-y: auto"
                    >
                      <div
                        class="tab-pane fade show active"
                        id="ingredients-tab"
                      >
                        <div class="bg-orange-100 rounded rounded-4 p-4">
                          <ul
                            class="list-unstyled mb-0"
                            id="ingredients-list"
                          ></ul>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div
                    class="tab-pane fade"
                    id="pills-instructions"
                    role="tabpanel"
                    aria-labelledby="pills-instructions-tab"
                    tabindex="0"
                  >
                    <div
                      class="tab-content"
                      style="max-height: 350px; overflow-y: auto"
                    >
                      <div
                        class="tab-pane fade show active"
                        id="instructions-tab"
                      >
                        <div class="bg-orange-100 rounded rounded-4 p-4">
                          <ul
                            class="list-unstyled mb-0"
                            id="instructions-list"
                          ></ul>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div
                    class="tab-pane fade"
                    id="pills-nutrition"
                    role="tabpanel"
                    aria-labelledby="pills-nutrition-tab"
                    tabindex="0"
                  >
                    <div
                      class="row g-3"
                      style="max-height: 350px; overflow-y: auto"
                      id="nutrition-list"
                    >
                      <div class="col-12 col-md-6">
                        <div
                          class="d-flex align-items-center justify-content-between p-3 bg-light rounded-4"
                        >
                          <div class="d-flex align-items-center">
                            <div class="me-3 p-3 bg-orange-50 rounded">
                              <i class="fa-solid fa-fire"></i>
                            </div>
                            <span class="fw-medium">Calories</span>
                          </div>
                          <span class="fw-bold" id="calories-value"></span>
                        </div>
                      </div>

                      <div class="col-12 col-md-6">
                        <div
                          class="d-flex align-items-center justify-content-between p-3 bg-light rounded-4"
                        >
                          <div class="d-flex align-items-center">
                            <div class="me-3 p-3 bg-blue-50 rounded">
                              <i class="fa-solid fa-dumbbell"></i>
                            </div>
                            <span class="fw-medium">Protein</span>
                          </div>
                          <span class="fw-bold" id="protein-value"></span>
                        </div>
                      </div>
                      <div class="col-12 col-md-6">
                        <div
                          class="d-flex align-items-center justify-content-between p-3 bg-light rounded-4"
                        >
                          <div class="d-flex align-items-center">
                            <div class="me-3 p-3 bg-yellow-50 rounded">
                              <i class="fa-solid fa-wheat-awn"></i>
                            </div>
                            <span class="fw-medium">Carbohydrates</span>
                          </div>
                          <span class="fw-bold" id="carbs-value"></span>
                        </div>
                      </div>
                      <div class="col-12 col-md-6">
                        <div
                          class="d-flex align-items-center justify-content-between p-3 bg-light rounded-4"
                        >
                          <div class="d-flex align-items-center">
                            <div class="me-3 p-3 bg-red-50 rounded">
                              <i class="fa-solid fa-droplet"></i>
                            </div>
                            <span class="fw-medium">Fat</span>
                          </div>
                          <span class="fw-bold" id="fat-value"></span>
                        </div>
                      </div>
                      <div class="col-12 col-md-6">
                        <div
                          class="d-flex align-items-center justify-content-between p-3 bg-light rounded-4"
                        >
                          <div class="d-flex align-items-center">
                            <div class="me-3 p-3 bg-green-50 rounded">
                              <i class="fa-solid fa-seedling"></i>
                            </div>
                            <span class="fw-medium">Fiber</span>
                          </div>
                          <span class="fw-bold" id="fiber-value"></span>
                        </div>
                      </div>
                      <div class="col-12 col-md-6">
                        <div
                          class="d-flex align-items-center justify-content-between p-3 bg-light rounded-4"
                        >
                          <div class="d-flex align-items-center">
                            <div class="me-3 p-3 bg-purple-50 rounded">
                              <i class="fa-solid fa-cube"></i>
                            </div>
                            <span class="fw-medium">Sodium</span>
                          </div>
                          <span class="fw-bold" id="sodium-value"></span>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div
                    class="tab-pane fade"
                    id="pills-tips"
                    role="tabpanel"
                    aria-labelledby="pills-chef'sTips-tab"
                    tabindex="0"
                  >
                    <div
                      class="row g-3"
                      style="max-height: 350px; overflow-y: auto"
                    >
                      <div class="col-12 col-md-12" id="tips-list"></div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="d-flex align-items-center gap-3 mt-4 pt-3 border-top">
                <button
                  id="try-another-btn"
                  class="btn btn-warning text-white fw-semibold d-flex align-items-center gap-2 px-4 py-2 shadow"
                >
                  <i class="fa-solid fa-rotate"></i>
                  Try Another Recipe
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
